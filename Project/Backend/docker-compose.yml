services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db-container
    environment:
      POSTGRES_USER: ${DB_USERNAME:-studyplan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "${EXTERNAL_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-studyplan} -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - user-service-network

  redis:
    image: redis:7-alpine
    container_name: user-service-redis
    ports:
      - "${EXTERNAL_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - user-service-network

  migration-runner:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: migration-runner-app
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME:-studyplan}:${DB_PASSWORD:-secret}@postgres-db:5432/db_user
      SCHEDULER_DATABASE_URL: postgresql://${DB_USERNAME:-studyplan}:${DB_PASSWORD:-secret}@postgres-db:5432/db_scheduler
      TEAMWORK_DATABASE_URL: postgresql://${DB_USERNAME:-studyplan}:${DB_PASSWORD:-secret}@postgres-db:5432/db_teamwork
    entrypoint:
      - sh
      - -c
      - |
        echo 'Running users-service migrations...'
        if ! ./node_modules/.bin/prisma migrate deploy --schema=src/users-service/prisma/schema.prisma; then
          echo ' FATAL: users-service migration failed!'
          exit 1
        fi
        
        echo 'Running scheduler-service migrations...'
        if ! ./node_modules/.bin/prisma migrate deploy --schema=src/scheduler-service/scheduler/prisma/schema.prisma; then
          echo ' FATAL: scheduler-service migration failed!'
          exit 1
        fi
        
        echo 'Running teamwork-service migrations...'
        if ! ./node_modules/.bin/prisma migrate deploy --schema=src/teamwork-service/prisma/schema.prisma; then
          echo ' FATAL: teamwork-service migration failed!'
          exit 1
        fi
        
        echo ' All migrations completed successfully!'
    networks:
      - user-service-network

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: user-service
    container_name: user-service-app
    environment:
      NODE_ENV: production
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-studyplan}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_NAME: db_user
      DATABASE_URL: postgresql://${DB_USERNAME:-studyplan}:${DB_PASSWORD:-secret}@postgres-db:5432/db_user
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      HTTP_PORT: 8011
      TCP_PORT: 8001
    ports:
      - "${EXTERNAL_USER_SERVICE_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8011/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    networks:
      - user-service-network
    restart: unless-stopped

  scheduler-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: scheduler-service
    container_name: scheduler-service-app
    environment:
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh
      SCHEDULER_DATABASE_URL: postgresql://${DB_USERNAME:-studyplan}:${DB_PASSWORD:-secret}@postgres-db:5432/db_scheduler
      DATABASE_URL: postgresql://${DB_USERNAME:-studyplan}:${DB_PASSWORD:-secret}@postgres-db:5432/db_scheduler
      USER_SERVICE_URL: http://user-service-app:8011
      HTTP_PORT: 8003
      TCP_PORT: 8004
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TEAMWORK_SERVICE_HOST: teamwork-service-app
      TEAMWORK_SERVICE_PORT: 8007
    ports:
      - "${EXTERNAL_SCHEDULER_SERVICE_PORT:-8004}:8004"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    networks:
      - user-service-network
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: ai-service
    container_name: ai-service-app
    environment:
      NODE_ENV: production
      TCP_PORT: 8005
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "${EXTERNAL_AI_SERVICE_PORT:-8005}:8005"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8005"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - user-service-network
    restart: unless-stopped

  teamwork-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: teamwork-service
    container_name: teamwork-service-app
    environment:
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh
      TEAMWORK_DATABASE_URL: postgresql://${DB_USERNAME:-studyplan}:${DB_PASSWORD:-secret}@postgres-db:5432/db_teamwork
      DATABASE_URL: postgresql://${DB_USERNAME:-studyplan}:${DB_PASSWORD:-secret}@postgres-db:5432/db_teamwork
      USER_SERVICE_URL: http://user-service-app:8011
      HTTP_PORT: 8006
      TCP_PORT: 8007
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
    ports:
      - "${EXTERNAL_TEAMWORK_SERVICE_PORT:-8007}:8007"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8006/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    networks:
      - user-service-network
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-gateway
    container_name: api-gateway-app
    environment:
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh
      GATEWAY_PORT: 8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      # Microservice TCP connections (user + analytics + ai use TCP)
      USER_SERVICE_URL: http://user-service-app:8001
      USER_SERVICE_HOST: user-service-app
      USER_SERVICE_PORT: 8001
      SCHEDULER_SERVICE_URL: http://scheduler-service-app:8003
      SCHEDULER_SERVICE_HOST: scheduler-service-app
      SCHEDULER_SERVICE_PORT: 8004
      TEAMWORK_SERVICE_URL: http://teamwork-service-app:8006
      TEAMWORK_SERVICE_HOST: teamwork-service-app
      TEAMWORK_SERVICE_PORT: 8007
      AI_SERVICE_URL: http://ai-service-app:8005
      AI_SERVICE_HOST: ai-service-app
      AI_SERVICE_PORT: 8005
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:8000/api/v1/auth/google/callback}
      # GitHub OAuth
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:8000/api/v1/auth/github/callback}
      # Discord OAuth
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_CALLBACK_URL: ${DISCORD_CALLBACK_URL:-http://localhost:8000/api/v1/auth/discord/callback}
      # LinkedIn OAuth
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_CALLBACK_URL: ${LINKEDIN_CALLBACK_URL:-http://localhost:8000/api/v1/auth/linkedin/callback}
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      user-service:
        condition: service_healthy
      scheduler-service:
        condition: service_healthy
      teamwork-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - user-service-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  user-service-network:
    driver: bridge
