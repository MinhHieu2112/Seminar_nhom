version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db-container
    environment:
      POSTGRES_USER: ${DB_USERNAME:-studyplan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-studyplan} -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - user-service-network

  redis:
    image: redis:7-alpine
    container_name: user-service-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - user-service-network

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user-service
    container_name: user-service-app
    environment:
      NODE_ENV: production
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-studyplan}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_NAME: db_user
      DATABASE_URL: postgresql://${DB_USERNAME:-studyplan}:${DB_PASSWORD:-secret}@postgres-db:5432/db_user
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-dev_refresh_secret_change_in_production}
      HTTP_PORT: 8011
      TCP_PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - user-service-network
    restart: unless-stopped

  scheduler-service:
    build:
      context: .
      dockerfile: Dockerfile.scheduler-service
    container_name: scheduler-service-app
    environment:
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh
      SCHEDULER_DATABASE_URL: postgresql://${DB_USERNAME:-studyplan}:${DB_PASSWORD:-secret}@postgres-db:5432/db_scheduler
      DATABASE_URL: postgresql://${DB_USERNAME:-studyplan}:${DB_PASSWORD:-secret}@postgres-db:5432/db_scheduler
      USER_SERVICE_URL: http://user-service-app:8011
      HTTP_PORT: 8003
      TCP_PORT: 8004
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8004:8004"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - user-service-network
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai-service
    container_name: ai-service-app
    environment:
      NODE_ENV: production
      TCP_PORT: 8005
    ports:
      - "8005:8005"
    networks:
      - user-service-network
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway-app
    environment:
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh
      GATEWAY_PORT: 8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-dev_refresh_secret_change_in_production}
      # Microservice TCP connections (user + analytics + ai use TCP)
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: 8001
      SCHEDULER_SERVICE_URL: http://scheduler-service-app:8003
      SCHEDULER_SERVICE_HOST: scheduler-service-app
      SCHEDULER_SERVICE_PORT: 8004
      AI_SERVICE_HOST: ai-service
      AI_SERVICE_PORT: 8005
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:8000/api/v1/auth/google/callback}
      # GitHub OAuth
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:8000/api/v1/auth/github/callback}
      # Facebook OAuth
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL:-http://localhost:8000/api/v1/auth/facebook/callback}
      # LinkedIn OAuth
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_CALLBACK_URL: ${LINKEDIN_CALLBACK_URL:-http://localhost:8000/api/v1/auth/linkedin/callback}
    ports:
      - "8000:8000"
    depends_on:
      - user-service
      - scheduler-service
      - ai-service
    networks:
      - user-service-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  user-service-network:
    driver: bridge
