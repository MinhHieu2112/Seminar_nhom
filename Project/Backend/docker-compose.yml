version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: user-service-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-studyplan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-studyplan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-studyplan} -d ${DB_NAME:-studyplan}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - user-service-network

  redis:
    image: redis:7-alpine
    container_name: user-service-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - user-service-network

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user-service
    container_name: user-service-app
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-studyplan}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_NAME: ${DB_NAME:-studyplan}
      DATABASE_URL: postgresql://${DB_USERNAME:-studyplan}:${DB_PASSWORD:-secret}@postgres:5432/${DB_NAME:-studyplan}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-dev_refresh_secret_change_in_production}
      HTTP_PORT: 8011
      TCP_PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - user-service-network
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.notification-service
    container_name: notification-service-app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USERNAME:-studyplan}:${DB_PASSWORD:-secret}@postgres:5432/${DB_NAME:-studyplan}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TCP_PORT: 8002
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@studyplan.app}
    # No TCP port exposed. Entirely queue-driven.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - user-service-network
    restart: unless-stopped

  scheduler-service:
    build:
      context: .
      dockerfile: Dockerfile.scheduler-service
    container_name: scheduler-service-app
    environment:
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh
      DATABASE_URL: postgresql://${DB_USERNAME:-studyplan}:${DB_PASSWORD:-secret}@postgres:5432/scheduler_db
      USER_SERVICE_URL: http://user-service-app:8001
      HTTP_PORT: 8003
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - user-service-network
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai-service
    container_name: ai-service-app
    environment:
      NODE_ENV: production
      TCP_PORT: 8005
    ports:
      - "8005:8005"
    networks:
      - user-service-network
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile.analytics-service
    container_name: analytics-service-app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USERNAME:-studyplan}:${DB_PASSWORD:-secret}@postgres:5432/${DB_NAME:-studyplan}
      ANALYTICS_TCP_PORT: 8006
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - user-service-network
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway-app
    environment:
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh
      GATEWAY_PORT: 8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-dev_refresh_secret_change_in_production}
      # Microservice TCP connections (user + analytics + ai use TCP)
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: 8001
      SCHEDULER_SERVICE_URL: http://scheduler-service-app:8003
      ANALYTICS_SERVICE_HOST: analytics-service
      ANALYTICS_SERVICE_PORT: 8006
      AI_SERVICE_HOST: ai-service
      AI_SERVICE_PORT: 8005
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:8000/api/v1/auth/google/callback}
      # GitHub OAuth
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:8000/api/v1/auth/github/callback}
      # Facebook OAuth
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL:-http://localhost:8000/api/v1/auth/facebook/callback}
      # LinkedIn OAuth
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_CALLBACK_URL: ${LINKEDIN_CALLBACK_URL:-http://localhost:8000/api/v1/auth/linkedin/callback}
    ports:
      - "8000:8000"
    depends_on:
      - user-service
      - scheduler-service
      - notification-service
      - analytics-service
    networks:
      - user-service-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  user-service-network:
    driver: bridge
