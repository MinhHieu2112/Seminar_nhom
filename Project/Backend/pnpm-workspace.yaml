packages:
  - '.'

allowBuilds:
  '@google/genai': true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  puppeteer: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@google/genai'
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - bcrypt
  - msgpackr-extract
  - prisma
  - protobufjs
  - unrs-resolver
